# Colorschemes
# - "https://github.com/alacritty/alacritty-theme/tree/master/themes"
# - create a new file per colorscheme, and import it here.
import = [
  #"~/.config/alacritty/catppuccin_mocha.toml"
  #"~/.config/alacritty/catppuccin_macchiato.toml"
  #"~/.config/alacritty/gruvbox_material.toml"
  #"~/.config/alacritty/tokyonight_storm.toml"
  "~/.config/alacritty/tokyonight.toml"
  #"~/.config/alacritty/tokyonight-night.toml"
]

[env]
TERM = "xterm-256color"
#WINIT_X11_SCALE_FACTOR = "1.66"
WINIT_X11_SCALE_FACTOR = "1.1"

[window]
padding.x = 0
padding.y = 0

opacity = 0.95
decorations = "Buttonless" # "Full" | "None" | "Transparent" | "Buttonless"

[font]
normal.family = "Hack Nerd Font"
size = 11
