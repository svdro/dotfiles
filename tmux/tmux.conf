# Note:
# -s is for setting an option at the server level (e.g. across all sessions)
# -g is for setting an option at the global level (e.g. across all windows in a session)


# =========== basics ========================================================

unbind R
#bind R source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf" # reload tmux config
bind R source-file ~/.config/tmux/tmux.conf \; display "Reloaded ~/.tmux.conf" # reload tmux config

# escape sequences get delayed by tmux, thus a shorter escape time will make vim feel snappier
set -s escape-time 0


# =========== fix term colors ===============================================

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0


# =========== navigation ====================================================

# navigate between panes
set -g mouse on
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind r
bind r rotate-window    # rotate panes in current window
#bind R rotate-window -D # rotate panes in current window in opposite direction


# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# other
set -g history-limit 100000
#unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse


# =========== copy mode =====================================================

set-window-option -g mode-keys vi # use vi keys in copy mode

# enter and exit copy mode
bind-key v copy-mode
bind-key -T copy-mode-vi q send-keys -X cancel

# begin visual mode
unbind -T copy-mode-vi Space;                                               # Default for begin-selection
bind -T copy-mode-vi v send-keys -X begin-selection                         # begin-selection



# copy selection
unbind -T copy-mode-vi Enter;                                               # Default for copy-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel --clipboard" # Copy to default linux cliboard

## Check if running on macOS and use pbcopy
if-shell 'uname | grep -q Darwin' {
  unbind -T copy-mode-vi Enter                                                                 # Default for copy-selection
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy' # Copy to default macos cliboard
}

# navigate visual mode
unbind -T copy-mode-vi C-u
unbind -T copy-mode-vi C-d
bind-key -T copy-mode-vi C-u send-keys -X -N 10 cursor-up   # Adjust 10 lines up
bind-key -T copy-mode-vi C-d send-keys -X -N 10 cursor-down # Adjust 10 lines down

bind-key -T copy-mode-vi g send-keys -X history-top     # top of the buffer
bind-key -T copy-mode-vi G send-keys -X history-bottom  # bottom of the buffer

bind-key -T copy-mode-vi r send-keys -X rectangle-toggle # rectangle toggle (start highlighting next line at cursor position)

# paste buffer
bind p paste-buffer # paste from default clipboard


# =========== colorscheme ===================================================

# separators  ,  , █

source ~/.config/tmux/themes/catppuccin_mocha
# source ~/.config/tmux/themes/catppuccin_latte

### status
set -g status "on"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-style ""
set -g status-style "bg=#{@BG_BAR}"

### status left/right
set -g status-left ""
set -g status-right "#[fg=#{@TEXT},bg=default]#{?window_zoomed_flag, ZOOM ,}"
# set -g status-right ""

### message
set -g message-style "fg=#{@TEXT_IMPORTANT},bg=#{@BG_WINDOW},align=centre"
set -g message-command-style "fg=#{@TEXT_IMPORTANT},bg=#{@BG_WINDOW},align=centre"

### pane
setw -g pane-border-status "off"
setw -g pane-active-border-style "#{?pane_in_mode,fg=$BG_WINDOW_ACTIVE$,#{?pane_synchronized,fg=#c6a0f6,fg=$BG_WINDOW_ACTIVE}}"
setw -g pane-border-style "fg=#{@BG_WINDOW}"
setw -g pane-border-format ""

### window
setw -g window-status-separator ""
set -g @status-content "#{b:pane_current_path}"
# display current path in window status
# setw -g window-status-format " #[fg=#{@FG_WINDOW},bg=default]#[fg=#{@BG_WINDOW},bg=#{@FG_WINDOW}]#I#[fg=#{@BG_WINDOW},bg=#{@FG_WINDOW},nobold,nounderscore,noitalics] █#[fg=#{@TEXT},bg=#{@BG_WINDOW}]#{b:pane_current_path}#[fg=#{@BG_WINDOW},bg=default,nobold,nounderscore,noitalics]"
# setw -g window-status-current-format " #[fg=#{@FG_WINDOW_ACTIVE},bg=default]#[fg=#{@BG_WINDOW_ACTIVE},bg=#{@FG_WINDOW_ACTIVE}]#I#[fg=#{@BG_WINDOW_ACTIVE},bg=#{@FG_WINDOW_ACTIVE},nobold,nounderscore,noitalics] █#[fg=#{@TEXT},bg=#{@BG_WINDOW_ACTIVE}]#{b:pane_current_path}#[fg=#{@BG_WINDOW_ACTIVE},bg=default,nobold,nounderscore,noitalics]"

# display default
setw -g window-status-format " #[fg=#{@FG_WINDOW},bg=default]#[fg=#{@BG_WINDOW},bg=#{@FG_WINDOW}]#I#[fg=#{@BG_WINDOW},bg=#{@FG_WINDOW},nobold,nounderscore,noitalics] █#[fg=#{@TEXT},bg=#{@BG_WINDOW}]#W#[fg=#{@BG_WINDOW},bg=default,nobold,nounderscore,noitalics]"
setw -g window-status-current-format " #[fg=#{@FG_WINDOW_ACTIVE},bg=default]#[fg=#{@BG_WINDOW_ACTIVE},bg=#{@FG_WINDOW_ACTIVE}]#I#[fg=#{@BG_WINDOW_ACTIVE},bg=#{@FG_WINDOW_ACTIVE},nobold,nounderscore,noitalics] █#[fg=#{@TEXT},bg=#{@BG_WINDOW_ACTIVE}]#W#[fg=#{@BG_WINDOW_ACTIVE},bg=default,nobold,nounderscore,noitalics]"

### other
setw -g mode-style "fg=#f5bde6 bg=#5b6078 bold"
setw -g clock-mode-colour "#8aadf4"
setw -g mode-style "fg=#f5bde6 bg=#5b6078 bold"
